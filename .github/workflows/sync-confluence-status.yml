name: Sync Confluence status

on:
  # Daily at 06:00 Paris time (04:00 UTC summer / 05:00 UTC winter).
  # We pick 05:00 UTC — close enough year-round and avoids DST edge cases.
  schedule:
    - cron: "0 5 * * *"
  # Manual trigger — shows up as "Run workflow" in the Actions tab.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run sync script
        env:
          ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
          ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
        run: node scripts/sync.js

      - name: Commit updated status.json
        run: |
          if git diff --quiet status.json; then
            echo "No changes to status.json — skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json
          git commit -m "chore: refresh Confluence status [skip ci]"
          git push
